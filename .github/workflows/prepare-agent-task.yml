name: Prepare Agent Task

on:
  issues:
    types: [opened, edited, reopened]
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize GitHub task
        run: node scripts/agents/normalize-task.mjs --source github-event --input "$GITHUB_EVENT_PATH" --output-dir tasks/ready/github

      - name: Upload normalized task artifact
        uses: actions/upload-artifact@v4
        with:
          name: normalized-agent-task
          path: tasks/ready/github/*.json
          if-no-files-found: error
